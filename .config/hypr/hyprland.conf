
#AUTOGENERATED HYPR CONFIG.
#PLEASE USE THE CONFIG PROVIDED IN THE GIT REPO /examples/hypr.conf AND EDIT IT,
#OR EDIT THIS ONE ACCORDING TO THE WIKI INSTRUCTIONS.

#
# Please note not all available settings / options are set here.
# For a full list, see the wiki
#


# set the wallpaper 
exec-once=hyprpaper & waybar

# set waybar

#exec-once=waybar

# See https://wiki.hyprland.org/Configuring/Monitors/
monitor=DP-1,2560x1440@165,auto,1,
monitor=HDMI-A-1,preferred,auto,1,transform,3

# See https://wiki.hyprland.org/Configuring/Keywords/ for more

# Execute your favorite apps at launch
# exec-once = waybar & hyprpaper & firefox

# Source a file (multi-file configs)
# source = ~/.config/hypr/myColors.conf

# For all categories, see https://wiki.hyprland.org/Configuring/Variables/
input {
    kb_layout = it
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =

    follow_mouse = 1
    
    numlock_by_default = true

    touchpad {
        natural_scroll = no
    }

    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.
}

general {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more

    gaps_in = 10
    gaps_out = 20
    border_size = 2
    col.active_border = rgba(e73259ff)
    col.inactive_border = rgba(3b3b3dff)

    layout = tile
}

decoration {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more

    rounding = 10

    blur {
        enabled = true
        size = 3
        passes = 3
    }


    inactive_opacity = 1
    shadow {
        enabled = yes
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }
}

animations {
    enabled = yes

    # Some default animations, see https://wiki.hyprland.org/Configuring/Animations/ for more

  bezier=easeinoutsine, 0.37, 0, 0.63, 1
  animation=windows,1,2,easeinoutsine,slide
  animation=border,1,10,default
  animation=fade,1,1,default
  animation=workspaces,1,2,easeinoutsine,slide
}

dwindle {
    # See https://wiki.hyprland.org/Configuring/Dwindle-Layout/ for more
    pseudotile = yes # master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below
    preserve_split = yes # you probably want this
}

master {
    # See https://wiki.hyprland.org/Configuring/Master-Layout/ for more
}

gestures {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more
    # workspace_swipe = on
}
# Example per-device config
# See https://wiki.hyprland.org/Configuring/Keywords/#executing for more
#device:epic mouse V1 {
#    sensitivity = -0.5
#}

#windowrule = size 50% 50%, title:^(Alacritty)$

# Example windowrule v1
windowrule = float,class:Rofi
windowrule = size 30% 20%, class:Rofi
windowrule = center, class:Rofi
windowrule = dimaround, class:Rofi
windowrule = stayfocused, class:Rofi 
layerrule = blur, class:Rofi

# Example windowrule v2
#windowrulev2 = float,class: title:^.*$
# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more

windowrule = tile, title:^(firefox)$
windowrule = tile, title:^(Code)$
layerrule=blur, wlogout

# See https://wiki.hyprland.org/Configuring/Keywords/ for more
$mainMod = SUPER

# Screenshot binding
bindl=,Print,exec , GRIM_DEFAULT_DIR=~/Immagini/screenshots grim -g "$(slurp)"

# Example volume button that allows press and hold
binde=, XF86AudioRaiseVolume, exec, pactl set-sink-volume @DEFAULT_SINK@ +5%

# Example volume button that will activate even while an input inhibitor is active
binde=, XF86AudioLowerVolume, exec, pactl set-sink-volume @DEFAULT_SINK@ -5%

bindl=, XF86AudioMute, exec, pactl set-sink-volume @DEFAULT_SINK@ 1

#for the screen brightness

binde=, XF86MonBrightnessDown, exec, ~/.config/hypr/brightness.sh -100
binde=, XF86MonBrightnessUp, exec, ~/.config/hypr/brightness.sh 100

bind = , XF86PowerOff, exec, ags -t session0

bindl = $mainMod, F11 , fullscreen, 0

# Example binds, see https://wiki.hyprland.org/Configuring/Binds/ for more
bind = $mainMod, Q, exec, alacritty
#bind = $mainMod, W, exec, alacritty -e nvim
bind = $mainMod, A, exec, rofi -show drun -normal-window
bind = $mainMod, C, killactive, 
bind = $mainMod, S, exec, spotify-launcher
#bind = $mainMod, S, exec, LD_PRELOAD=/usr/local/lib/spotify-adblock.so spotify
bind = $mainMod, M, exit, 
bind = $mainMod, E, exec, nemo
bind = $mainMod, F, exec, firefox
bind = $mainMod, V, togglefloating, 
bind = $mainMod, R, exec, krunner
bind = $mainMod, P, pseudo, # dwindle
bind = $mainMod, O, togglesplit, # dwindle

# special workspaces
# windowrulev2 = float,class:Code
# windowrule = center, class:Code
# windowrulev2 = workspace special:editor,class:Code
# windowrule = size 90% 90%, class:Code
# bind = SUPER, W, exec, pgrep code && hyprctl dispatch togglespecialworkspace editor || code & 

# Special workspace for ChatGPT
#windowrulev2 = float,class:^(firefox)$,title:^(ChatGPT — Mozilla Firefox)$
#windowrule = center, class:^(firefox)$,title:^(ChatGPT — Mozilla Firefox)$
#windowrulev2 = workspace special:chatgpt,class:^(firefox)$,title:^(ChatGPT — Mozilla Firefox)$
#windowrule = size 90% 90%, class:^(firefox)$,title:^(ChatGPT — Mozilla Firefox)$
#bind = SUPER, G, exec, pgrep -f "firefox.*chatgpt" && hyprctl dispatch togglespecialworkspace chatgpt || firefox --no-remote -P chatgpt --new-window https://chat.openai.com/




# Move focus with imainMod + arrow keys
bind = $mainMod, j, movefocus, l
bind = $mainMod, l, movefocus, r
bind = $mainMod, i, movefocus, u
bind = $mainMod, k, movefocus, d

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10


# Scroll through existing workspaces with mainMod + scroll
bind = CTRL ALT,l , workspace, +1
bind = CTRL ALT,j , workspace, -1


# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# sets repeatable binds for resizing the active window
bind=$mainMod ALT,l,resizeactive,20 0
bind=$mainMod ALT,j,resizeactive,-20 0
bind=$mainMod ALT,i,resizeactive,0 -20
bind=$mainMod ALT,k,resizeactive,0 20



windowrule = opacity 0.0 override, class:^(xwaylandvideobridge)$
windowrule = noanim, class:^(xwaylandvideobridge)$
windowrule = noinitialfocus, class:^(xwaylandvideobridge)$
windowrule = maxsize 1 1, class:^(xwaylandvideobridge)$
windowrule = noblur, class:^(xwaylandvideobridge)$
windowrule = nofocus, class:^(xwaylandvideobridge)$
